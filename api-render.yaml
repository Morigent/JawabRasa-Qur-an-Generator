services:
  - type: web
    name: jawabrasa-api
    env: node
    region: singapore
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @jawabrasa/api build
    startCommand: cd packages/api && node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
