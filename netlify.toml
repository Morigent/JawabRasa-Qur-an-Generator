[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Proxy API requests to Render (same-origin → no CORS issues)
[[redirects]]
  from = "/api/*"
  to = "https://jawabrasa-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — all other paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
